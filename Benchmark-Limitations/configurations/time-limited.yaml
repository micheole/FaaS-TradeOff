mode: "time-limited"

# Benchmark Function: "monte-carlo" or "sieve-of-eratosthenes"
benchmark: "monte-carlo"

# The total duration in seconds
duration: 200

# The rate at which we generate load
arrival_rate: 5

# Artillery scenarios for each cloud provider (AWS and GCP)
artillery_scenarios: 
  aws:
    path: "limitations/time-limited/monte_carlo_artillery.yaml"
    target: "https://kvqr743a39.execute-api.eu-central-1.amazonaws.com/dev/lambda"
    region: "eu-central-1"
    loggroup: "/aws/lambda/monte_carlo_simulation_lambda"
  gcp:
    path: "limitations/time-limited/monte_carlo_artillery.yaml"
    target: ""
    region: ""
    projectid: ""