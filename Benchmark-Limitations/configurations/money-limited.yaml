mode: "money-limited"

# Benchmark Function: "monte-carlo" or "sieve-of-eratosthenes"
benchmark: "monte-carlo"

# The maximum budget in USD
total_budget: 0.005

arrival_count: 100

# If you want to limit how many times we can keep running
max_batches: 30

# Artillery scenarios for each cloud provider (AWS and GCP)
artillery_scenarios:
  aws:
    path: "limitations/money-limited/monte_carlo_artillery.yaml"
    target: ""
    region: ""
    loggroup: ""
  gcp:
    path: "limitations/money-limited/sieve_artillery.yaml"
    target: ""
    region: ""
    projectid: ""