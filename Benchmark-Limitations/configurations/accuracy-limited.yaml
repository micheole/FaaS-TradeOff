mode: "accuracy-limited"

# Benchmark Function: "monte-carlo" or "sieve-of-eratosthenes"
benchmark: "monte-carlo"

# Each batch run length (seconds) for Artillery
batch_duration: 30

# Total runs for each batch
arrival_count: 150

# The desired CI width threshold in percentage points for the 95% CI
desired_ci_width: 5

# Upper limit on how many times we run
max_batches: 20

# Artillery scenarios for each cloud provider (AWS and GCP)
artillery_scenarios:
  aws:
    path: "limitations/accuracy-limited/monte_carlo_artillery.yaml"
    target: ""
    region: ""
    loggroup: ""
  gcp:
    path: "limitations/accuracy-limited/monte_carlo_artillery.yaml"
    target: ""
    region: ""
    projectid: ""